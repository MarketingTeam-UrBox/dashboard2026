const b642buf=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
 const enc=new TextEncoder();
 const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b642buf(DATA.salt),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b642buf(DATA.iv)},key,b642buf(DATA.blob));
 return new TextDecoder().decode(pt);
}
async function submit(){const pw=document.getElementById("pw").value,e=document.getElementById("e");e.textContent="";
 try{const html=await open(pw);document.open();document.write(html);document.close();}
 catch(err){e.textContent="Sai mật khẩu.";}}
document.getElementById("go").onclick=submit;
document.getElementById("pw").addEventListener("keydown",ev=>{if(ev.key==="Enter")submit();});
</script></body></html>
